# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

project:
  stage: Systems Design

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

engine:
  name: "Unreal"
  version: "5.8"
  language: "Blueprint"
  rendering: "Lumen + Nanite (deferred)"
  physics: "Chaos"
  path: "D:/Game/EPIC/UE_5.8"

specialists:
  code: "unreal-specialist"
  shader: "unreal-specialist"
  ui: "ue-umg-specialist"
  additional: ["ue-gas-specialist", "ue-blueprint-specialist", "ue-replication-specialist"]

naming:
  classes: PascalCase
  variables: PascalCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from
                               # docs/engine-reference/unreal/; confirm before relying on it
  signals: PascalCase On<Event>
  files: PascalCase
  scenes: PascalCase

commands:
  # Project: Game_01 5.8/Game_01.uproject (C++ module Game_01). The build command is the one
  # recorded for the packages (docs/wiki/build-and-run.md section 8): close the editor first,
  # replace <name> with the package folder name; the output is <name>/Windows/Game_01.exe.
  # Leave Game_01.pdb out of a zip.
  build: '"D:/Game/EPIC/UE_5.8/Engine/Build/BatchFiles/RunUAT.bat" BuildCookRun -project="$(pwd -W 2>/dev/null || pwd)/Game_01 5.8/Game_01.uproject" -noP4 -platform=Win64 -clientconfig=Development -build -cook -stage -pak -archive -archivedirectory="$(pwd -W 2>/dev/null || pwd)/Game_01 5.8/Saved/Packages/<name>" -utf8output -unattended'
  test: '"D:/Game/EPIC/UE_5.8/Engine/Binaries/Win64/UnrealEditor-Cmd.exe" "$(pwd -W 2>/dev/null || pwd)/Game_01 5.8/Game_01.uproject" -ExecCmds="Automation RunTests Game_01.; Quit" -unattended -nullrhi -stdout -FullStdOutLogOutput'
  run: '"D:/Game/EPIC/UE_5.8/Engine/Binaries/Win64/UnrealEditor.exe" "$(pwd -W 2>/dev/null || pwd)/Game_01 5.8/Game_01.uproject" -game -windowed -ResX=1280 -ResY=720'
  smoke: '"D:/Game/EPIC/UE_5.8/Engine/Binaries/Win64/UnrealEditor-Cmd.exe" "$(pwd -W 2>/dev/null || pwd)/Game_01 5.8/Game_01.uproject" -game -nullrhi -unattended -stdout -ExecCmds="Quit"'

modes:
  rigor: minimal
  automation: autonomous
